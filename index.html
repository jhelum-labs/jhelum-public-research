<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jhelum Labs Research — research publications from the Jhelum Labs W-1.1 model program." />
    <meta name="theme-color" content="#000000" />
    <script>
      // Apply saved theme before first paint to avoid a light-mode flash.
      (function () {
        try {
          var t = localStorage.getItem('jl-theme')
          if (!t) {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kaushan+Script&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />
    <title>Jhelum Labs Research</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon — shown in browser tab and bookmarks -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- Primary SEO -->
    <title>Jhelum Labs Research</title>
    <meta name="description" content="Jhelum Labs Research — open AI research publications from the W-1.1 and W-1.2 model programs. Decoder-only Transformers trained from scratch." />
    <meta name="author" content="Jhelum Labs" />
    <meta name="keywords" content="Jhelum Labs, W-1.1, W-1.2, language model, AI research, open weights, transformer" />

    <!-- Open Graph — controls how the link looks when shared on WhatsApp, LinkedIn, Facebook, Discord etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jhelum Labs Research" />
    <meta property="og:title" content="Jhelum Labs Research" />
    <meta property="og:description" content="Open AI research from Jhelum Labs — W-1.1, W-1.2 and beyond. Decoder-only Transformers trained from scratch." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:alt" content="Jhelum Labs logo" />
    <meta property="og:url" content="https://jhelumlabs.in" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Jhelum Labs Research" />
    <meta name="twitter:description" content="Open AI research from Jhelum Labs — W-1.1, W-1.2 and beyond." />
    <meta name="twitter:image" content="/logo.png" />

    <script>
      // Apply saved theme before first paint to avoid a light-mode flash.
      (function () {
        try {
          var t = localStorage.getItem('jl-theme')
          if (!t) {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kaushan+Script&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
